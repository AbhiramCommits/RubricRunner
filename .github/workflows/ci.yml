name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  LLM_PROVIDER: mock
  DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rubricrunner
  API_BASE_URL: http://localhost:8000

jobs:
  api:
    name: API · lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rubricrunner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install API dependencies
        run: |
          python -m venv api/.venv
          api/.venv/bin/pip install -r api/requirements.txt
      - name: Ruff
        run: api/.venv/bin/ruff check api
      - name: Mypy
        run: api/.venv/bin/mypy api/app api/scripts api/seed.py
      - name: Apply migrations
        working-directory: api
        run: .venv/bin/alembic upgrade head
      - name: Pytest with coverage
        working-directory: api
        run: .venv/bin/pytest -q --cov=app --cov-report=term-missing

  web:
    name: Web · types, build, Playwright
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rubricrunner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install API dependencies
        run: |
          python -m venv api/.venv
          api/.venv/bin/pip install -r api/requirements.txt
      - name: Migrate and seed demo data
        run: |
          make migrate
          make seed
      - name: Start API
        run: |
          cd api
          nohup .venv/bin/uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: TypeScript
        working-directory: web
        run: npx tsc --noEmit
      - name: Next.js build
        working-directory: web
        run: npm run build
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start web server
        working-directory: web
        run: |
          nohup npm run start > /tmp/web.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf http://localhost:3000 > /dev/null && break
            sleep 1
          done
      - name: Playwright
        working-directory: web
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  eval:
    name: Eval harness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rubricrunner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install API dependencies
        run: |
          python -m venv api/.venv
          api/.venv/bin/pip install -r api/requirements.txt
      - name: Migrate and seed demo data
        run: |
          make migrate
          make seed
      - name: Run offline eval
        run: PYTHONPATH=api python eval/run_eval.py --prompt-versions v1_basic,v2_criterion_anchored
      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results
          retention-days: 30
