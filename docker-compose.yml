services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rubric
      POSTGRES_PASSWORD: rubric
      POSTGRES_DB: rubricrunner
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubric -d rubricrunner"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://rubric:rubric@postgres:5432/rubricrunner
      LLM_PROVIDER: mock
      API_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
